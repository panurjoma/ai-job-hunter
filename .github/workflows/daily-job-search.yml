name: Manual job discovery (fallback)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m job_hunter
      - uses: actions/upload-artifact@v4
        with:
          name: job-discovery
          path: output/
          if-no-files-found: warn
