name: Daily job discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e .
      - name: Discover job listings
        run: python -m job_hunter
      - name: Upload results for review
        uses: actions/upload-artifact@v4
        with:
          name: job-discovery
          path: output/
          if-no-files-found: warn
