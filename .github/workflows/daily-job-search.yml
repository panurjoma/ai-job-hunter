name: Process ChatGPT job inbox
on:
  push:
    branches: [main]
    paths:
      - 'data/inbox/jobs_*.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'templates/**'
      - '.github/workflows/daily-job-search.yml'
  workflow_dispatch:
    inputs:
      input_path:
        description: 'Repository-relative JSON input path'
        required: true
        default: 'data/inbox/example_jobs.json'
        type: string
permissions:
  contents: write
concurrency:
  group: job-inbox-${{ github.ref }}
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[pdf,test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run unit tests
        id: tests
        run: pytest -q
      - name: Resolve input files
        id: resolve
        if: github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PATH: ${{ inputs.input_path }}
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path.cwd().resolve()
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              paths = [os.environ["INPUT_PATH"]]
          else:
              result = subprocess.run(
                  ["git", "diff", "--name-only", "--diff-filter=AM", "HEAD^", "HEAD", "--", "data/inbox/"],
                  check=True, capture_output=True, text=True
              )
              paths = [p for p in result.stdout.splitlines()
                       if p.startswith("data/inbox/jobs_") and p.endswith(".json")]
          safe = []
          for p in paths:
              resolved = (root / p).resolve()
              if not resolved.is_relative_to(root / "data" / "inbox") or resolved.suffix != ".json" or not resolved.is_file():
                  raise SystemExit("Invalid input path: " + p)
              safe.append(p)
          if not safe:
              raise SystemExit("No new job JSON inputs found")
          Path("/tmp/job_inputs.txt").write_text("\n".join(safe) + "\n")
          print("Processing:", safe)
          PY
      - name: Process inputs and render CVs
        id: render
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r input; do
            stem="$(basename "$input" .json)"
            python -m job_hunter.cli --input "$input" --output "output/$stem" --pdf
          done < /tmp/job_inputs.txt
      - name: Persist generated CVs per run and job
        id: persist
        if: github.event_name != 'pull_request' && steps.render.outcome == 'success'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          run = os.environ["RUN_ID"]
          attempt = os.environ["RUN_ATTEMPT"]
          root = Path("data/generated") / run / f"attempt_{attempt}"
          count = 0
          for report_path in sorted(Path("output").glob("*/report.json")):
              batch = report_path.parent.name
              report = json.loads(report_path.read_text(encoding="utf-8"))
              target = root / batch
              target.mkdir(parents=True, exist_ok=True)
              shutil.copy2(report_path, target / "report.json")
              for item in report.get("results", []):
                  if not item.get("shortlisted"):
                      continue
                  job_id = item["id"]
                  src = report_path.parent / job_id
                  dest = target / "jobs" / job_id
                  dest.mkdir(parents=True, exist_ok=True)
                  for name in ("tailored_cv.pdf", "tailored_cv.html", "job.json", "tailoring_manifest.json"):
                      original = src / name
                      if not original.is_file():
                          raise SystemExit(f"Missing generated file: {original}")
                      shutil.copy2(original, dest / name)
                  count += 1
          root.mkdir(parents=True, exist_ok=True)
          (root / "manifest.json").write_text(json.dumps({
              "run_id": int(run), "attempt": int(attempt),
              "generated_cv_count": count,
              "root": str(root),
              "note": "Each batch contains report.json and jobs/<job_id>/ CV files."
          }, indent=2) + "\\n", encoding="utf-8")
          print(f"Persisted {count} CVs under {root}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/
          git commit -m "Persist CVs for run ${RUN_ID} attempt ${RUN_ATTEMPT} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload private run artifacts
        id: upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: matched-jobs-and-cvs-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Persist immutable run receipt
        if: always() && github.event_name != 'pull_request'
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          RESOLVE_RESULT: ${{ steps.resolve.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          PERSIST_RESULT: ${{ steps.persist.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import glob, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          steps = {key: os.environ[key] for key in ("TEST_RESULT", "RESOLVE_RESULT", "RENDER_RESULT", "UPLOAD_RESULT", "PERSIST_RESULT")}
          success = all(value == "success" for value in steps.values())
          summaries = []
          for filename in glob.glob("output/**/report.json", recursive=True):
              try:
                  report = json.loads(Path(filename).read_text(encoding="utf-8"))
                  summaries.append({
                      "report_path": filename,
                      "total": report.get("total"),
                      "unique": report.get("unique"),
                      "shortlisted": report.get("shortlisted"),
                      "jobs": [{
                          "company": item.get("company"), "title": item.get("title"),
                          "url": item.get("url"), "score": item.get("score"),
                          "eligibility": item.get("eligibility"), "shortlisted": item.get("shortlisted"),
                          "eligibility_notes": item.get("eligibility_notes", [])
                      } for item in report.get("results", [])]
                  })
              except (OSError, ValueError) as exc:
                  summaries.append({"report_path": filename, "read_error": str(exc)})
          run_id = os.environ["RUN_ID"]
          attempt = os.environ["RUN_ATTEMPT"]
          receipt = {
              "schema_version": "1.0",
              "run_id": int(run_id), "attempt": int(attempt),
              "commit_sha": os.environ["RUN_SHA"], "event": os.environ["RUN_EVENT"],
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "status": "success" if success else "failure",
              "steps": steps, "reports": summaries,
              "workflow_url": f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{run_id}",
              "artifact_name": f"matched-jobs-and-cvs-{run_id}" if steps["UPLOAD_RESULT"] == "success" else None,\n              "persistent_cv_root": f"data/generated/{run_id}/attempt_{attempt}" if steps["PERSIST_RESULT"] == "success" else None,
              "error_hint": next((name + " step failed" for name, outcome in steps.items() if outcome == "failure"), None)
          }
          destination = Path("data/runs") / f"{run_id}_attempt_{attempt}.json"
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("Persistent run receipt:", destination, receipt["status"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs/
          git commit -m "Record job hunter run ${RUN_ID} attempt ${RUN_ATTEMPT} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
