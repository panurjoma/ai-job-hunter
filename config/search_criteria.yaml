search:
  work_mode: remote_preferred_with_negotiable_hybrid
  hybrid_exception:
    allowed_countries: [Spain, Portugal]
    # Any industry qualifies if the employer is demonstrably technology-forward.
    require_technology_evidence: true
    # Other remote jobs are positive evidence, but not mandatory.
    require_evidence_of_other_remote_jobs: false
    allow_unknown_remote_policy_with_technology_evidence: true
    remote_negotiation_status: review_only
    # Hybrid is not a remote offer: explicitly flag negotiation uncertainty.
    require_hybrid_location_evidence: true
  seniority: [senior, staff, principal, architect, tech_lead, engineering_lead]
  regions: [Europe, Spain, Portugal, Netherlands]
  minimum_salary_eur: 90000
  unknown_salary_policy: review
  minimum_match_score: 60
  roles:
    - AI Engineer
    - ML Engineer
    - AI Tech Lead
    - AI Engineering Lead
    - Space Software Tech Lead
    - Space Systems Software Lead
    - Software Architect
    - Backend Tech Lead
    - Optimization Lead
    - Senior Backend Engineer
  specializations: [AI/ML, Software Architecture, Backend, Space/Aerospace, Optimization]
  require_remote_country_eligibility: true
  company_maturity:
    policy: prefer_established
    minimum_operating_years_preferred: 3
    unknown_company_policy: review
    exclude_verified_new_unproven_companies: true
    accept_small_but_established: true
    evidence_signals: [founding_year, operating_history, active_product, paying_customers, recurring_revenue, established_clients, funding_runway, reputable_parent_company]
  employment_quality:
    # Exclude contingent talent pools and task-based work, not legitimate consulting
    # positions with an actual assigned project or ongoing salaried employment.
    excluded_companies: [outlier.ai, outlier]
    excluded_models: [task_based_gig, ai_training_evaluator, talent_pool, contingent_project_matching, unassigned_contract]
    unknown_assignment_policy: review
    require_guaranteed_work_or_assigned_project: true
  auto_apply: false
