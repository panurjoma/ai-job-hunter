[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-hunter"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "PyYAML>=6.0", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
pdf = ["playwright>=1.48"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
